<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Add fonts from Adobe fonts or Google Fonts -->
    <title>Submit Recommendations</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400..700;1,400..700&family=Sora:wght@100..800&display=swap" rel="stylesheet">
    
    <!-- Add a favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
</head>
<body>
  <!-- Implement a skip to main! -->
  <a href="#main" class="skip-link">Skip to main content</a>

  <!-- <form action="" method="post"> Connect to formspree.io-->
<main id="main"> 
  <form action="https://formspree.io/f/xwllaook" method="POST" enctype="multipart/form-data">

    <label for="name">Name:</label>
    <input type="text" id="name" name="name" required><br><br>

    <fieldset class="radio">
      <legend>Area of Submission:</legend>
      
      <div>
        <input type="radio" id="travel" name="interest" value="travel" required>
        <label for="travel">Travel</label>
      </div>
      <div>
        <input type="radio" id="recipe" name="interest" value="recipe">
        <label for="recipe">Recipe</label>
      </div>
      <div>
        <input type="radio" id="pets" name="interest" value="pets">
        <label for="pets">Pets</label>
      </div>
    </fieldset><br><br>

    <label for="message">Message:</label>
    <textarea id="message" name="message"></textarea><br><br>

    <label for="image">Upload Image:</label><br>
    <input type="file" id="image" name="image"><br><br>

    <input type="submit" value="Submit">
    <button type="reset">Reset</button>

  </form>
</main>
</body>
</html>
